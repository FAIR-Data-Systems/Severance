services:
  external:
    image: fairdatasystems/sevexternal:2026-11-08@sha256:cb8b447eb7eded887d44ddb097454233b0276f130048e0b88720f96dadf6b9d2
    restart: always
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      # entrypoint.sh runs as root to chown the mounted volumes to the
      # severance user (UID 1000, see external/Dockerfile) before dropping
      # to it via gosu -- verified live, boots and writes real job/result
      # data to /data with exactly this set and nothing more.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    # No resource ceiling existed before this -- a bug or a burst of
    # requests could exhaust the whole host with no limit in place. These
    # are conservative starting points (matching Sextans-Suite's own
    # similarly-sized services), not tuned numbers; raise them if a real
    # workload needs more.
    mem_limit: 512m
    cpus: 1
    ports: ["3000:3000"]
    env_file:
      - .env
    volumes:
      - "./data:/data"
      - "./queries-metadata:/queries-metadata"
    environment:
      - RACK_ENV=production
      - APP_ENV=production     # both for redundancy
